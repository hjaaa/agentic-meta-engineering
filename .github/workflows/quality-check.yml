name: quality-check

# 对 PR + 推到主干兜底。本地 pre-commit 可被 --no-verify 绕过，这里是强制墙。
# 策略：strict 模式拒绝任何 error 与 warning；
# F-002：从 5 个独立 step 简化为单一 runner step（来源：detailed-design.md §4.4）

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml ruamel.yaml "pathspec>=0.12,<1.0" ruff pytest

      - name: Install bats-core
        run: |
          if ! command -v bats >/dev/null; then
            sudo apt-get update && sudo apt-get install -y bats
          fi

      # 该 step 通过 scripts/gates/run.py --trigger=ci --strict 收敛旧 5 step。
      # 如需临时放行 INDEX warning，应优先加 scripts/lib/index-config.yaml 的 ignore 白名单
      # （需 PR review）而非关 strict；legacy review escape_hatch 见 registry.yaml。
      # 新增 gate：在 registry.yaml 注册后自动参与 CI 扫描，无需修改本 workflow。
      - name: Run unified gate runner
        run: python scripts/gates/run.py --trigger=ci --strict

      # F-005：单元测试门禁；确保 gates/ 所有 plugin 测试全绿
      - name: pytest
        run: pytest tests/gates/ -v

      - name: bats hook tests
        run: bats tests/hooks/

      # F-005：ruff 静态检查（select=F 起步，历史 E501 > 200 条触发降级策略，后续独立 PR 扩展）
      - name: ruff lint
        run: ruff check scripts/ --select=F

      # D-007 强校验：gate-checklist.md 必须与 registry.yaml 保持同步。
      # 手工改 gate-checklist.md 后 PR 立即变红；需运行 make gates-render 重新生成。
      - name: Check gate-checklist.md is in sync with registry
        run: python3 scripts/gates/migration/render-docs.py --check
