# ASD 项目声明 —— 换项目只改此文件
# 格式约定:扁平 `key: value`,不支持嵌套(由 lib.sh 的 mget 解析)

language: python

# 测试布局与命令
test_dir: scripts
test_glob: test_*.py
test_command: python3 -m unittest discover -s scripts -p "test_*.py"

# AC ↔ 测试映射:{nn} 会被替换为 AC 的两位编号(AC-01 → 01)
ac_test_pattern: def test_ac{nn}_
comment_prefix: "#"

# spec 必备章节(逗号分隔,匹配任意级标题)
spec_required_sections: 目标,验收标准

# 管道步骤(按序执行,任一步失败即停)
pipeline_steps: spec-lint,test,ac-coverage
