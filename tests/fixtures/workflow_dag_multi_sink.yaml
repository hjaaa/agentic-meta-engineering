# F-004 rev2 DAG e2e fixture：多 sink 3 节点显式 depends_on
# 拓扑：
#       A
#      / \
#     B   C   （B 与 C 都依赖 A，两个 sink；串行派发顺序按 yaml 出现序）
#
# 用于验证 F-CR-001 修复（_advance_after_completed 按 depends_on_explicit 分流到
# _select_next_dispatch_target）+ F-CR-002 bootstrap（main_loop 入口起步）。
# 全节点显式 depends_on → loader 标 depends_on_explicit=True。
name: workflow-dag-multi-sink
version: 1
category: assist
provider: claude
model: sonnet

nodes:
  - id: a
    bash: 'echo a'
    depends_on: []
  - id: b
    bash: 'echo b'
    depends_on: [a]
  - id: c
    bash: 'echo c'
    depends_on: [a]
