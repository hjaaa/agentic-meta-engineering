# 多层节点（覆盖拓扑分层 + 字段优先级 yaml > 顶层）
name: multi-layer
version: 1
category: assist
provider: claude
model: sonnet
effort: medium

nodes:
  - id: a
    bash: 'echo a'
  - id: b
    bash: 'echo b'
    depends_on: [a]
  - id: c
    bash: 'echo c'
    depends_on: [a]
  - id: d
    bash: 'echo d'
    depends_on: [b, c]
    model: opus       # yaml 节点字段覆盖顶层默认
    effort: high
