# subagent 回执 JSON 团队级 Schema 定义（F-001）
#
# 用途：
#   - check_receipt.py 写入前的字段 / 枚举 / 格式 / 条件必填规则唯一事实源
#   - GATE-POST-DEV-RECEIPT / GATE-TOUCHES-VIOLATION 读取校验依据
#
# 数据载荷：requirements/<id>/artifacts/tasks/<F-xxx>.receipt.json
#
# 修改原则：
#   - 字段增删或枚举调整必须走 PR review（影响所有 subagent 实现者）
#   - schema_version 升 2.0 必须提供迁移脚本 scripts/lib/migrate_receipt_<from>_to_<to>.py
#
# 升级 SOP：
#   1. 本文件顶部 schema_version 字段升级（如 "1.0" → "1.1"）
#   2. check_receipt.py 的 SUPPORTED_VERSIONS 加入新版本（兼容期保留旧版本）
#   3. 破坏性升级须新增 scripts/lib/migrate_receipt_<from>_to_<to>.py 迁移脚本
#   4. 至少一个 release cycle 后再考虑剔除旧版本
#
# 关联文档：
#   - requirements/REQ-2026-008/artifacts/detailed-design.md §4（双层 schema_version）
#   - requirements/REQ-2026-008/artifacts/detailed-design.md §5.1（GATE-POST-DEV-RECEIPT）

schema_version: "1.0"

# ---------- 必填字段 ----------
required_fields:
  - schema_version
  - feature_id
  - status
  - commit_sha
  - files_changed
  - test_summary
  - touches_violations
  - concerns
  - missing_context
  - block_reason
  - timestamp

# ---------- 枚举 ----------
enums:
  status:
    - DONE
    - DONE_WITH_CONCERNS
    - NEEDS_CONTEXT
    - BLOCKED

# ---------- 字段格式 ----------
format:
  # major.minor 形式；不接受 '1' / '1.0.0' / '1.0-beta'
  # 禁止用 enum 锁定具体值——靠 format regex + check_receipt.py SUPPORTED_VERSIONS 双层校验
  schema_version: '^\d+\.\d+$'
  feature_id: '^F-\d{3}$'
  timestamp: iso8601
  # commit_sha 允许 "HEAD" 或 7-40 位十六进制（临时 / 正式均可）
  commit_sha: '^([0-9a-f]{7,40}|HEAD)$'

# ---------- 字段定义（文档化用途；conditional 规则见 conditional_required） ----------
fields:
  status:
    type: enum
    enum: status
    required: true
  feature_id:
    type: string
    format: feature_id
    required: true
  files_changed:
    type: list
    items: string
    required: true
    description: "本 feature 变更的文件路径列表；DONE 时可为空列表"
  touches_violations:
    type: list
    required: true
    description: "F-001 阶段固定为 []；F-005 起写入 violation 元素"
  concerns:
    type: list
    required: true
    description: "DONE 时必须为 []；DONE_WITH_CONCERNS 时为字符串列表"
  missing_context:
    type: string
    required: false
    description: "仅 NEEDS_CONTEXT 状态时必填；其他状态可为空字符串"
  block_reason:
    type: string
    required: false
    description: "仅 BLOCKED 状态时必填；其他状态可为空字符串"
  test_summary:
    type: string
    required: true
    description: "测试摘要，人类可读"
  commit_sha:
    type: string
    format: commit_sha
    required: true
  timestamp:
    type: string
    format: iso8601
    required: true

# ---------- 条件必填规则 ----------
# DONE_WITH_CONCERNS 时 concerns 必须非空
# NEEDS_CONTEXT 时 missing_context 必须非空
# BLOCKED 时 block_reason 必须非空
# DONE 时 concerns 必须为空列表（由 check_receipt.py _check_conditional 实现）
conditional_required:
  - when:
      status: DONE_WITH_CONCERNS
    non_empty:
      - concerns
  - when:
      status: NEEDS_CONTEXT
    non_empty:
      - missing_context
  - when:
      status: BLOCKED
    non_empty:
      - block_reason
