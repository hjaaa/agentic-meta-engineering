# task-planning 阶段产出的 features.json 团队级 Schema 定义（F-002）
#
# 用途：
#   - check_features.py 校验 features.json 字段 / 枚举 / 格式的唯一事实源
#   - GATE-FEATURES-SCHEMA 读取校验依据
#
# 数据载荷：requirements/<id>/artifacts/features.json
#
# 修改原则：
#   - 字段增删或枚举调整必须走 PR review（影响所有 task-planning 阶段产出）
#   - schema_version 升 2.0 必须提供迁移脚本 scripts/lib/migrate_features_<from>_to_<to>.py
#
# 升级 SOP：
#   1. 本文件顶部 schema_version 字段升级（如 "1.0" → "1.1"）
#   2. check_features.py 的 SUPPORTED_VERSIONS 加入新版本（兼容期保留旧版本）
#   3. 破坏性升级须新增 scripts/lib/migrate_features_<from>_to_<to>.py 迁移脚本
#   4. 至少一个 release cycle 后再考虑剔除旧版本
#
# 关联文档：
#   - requirements/REQ-2026-008/artifacts/detailed-design.md §2.1.1（features.json 结构）
#   - requirements/REQ-2026-008/artifacts/detailed-design.md §4.3（双层 schema_version）
#   - requirements/REQ-2026-008/artifacts/detailed-design.md §5.1（GATE-FEATURES-SCHEMA）
#
# ❗ status 字段**不在** required_fields 内（详细设计 §2.1.1 / round-005 决议）：
#   features.json 是 detail-design 阶段产出的静态计划文档，被 detail-design 评审 hash 锁定。
#   status 移出 features.json 到 tasks/<feature_id>.md frontmatter，避免开发期 hash drift。

schema_version: "1.0"

# ---------- 顶层必填字段 ----------
required_fields:
  - schema_version
  - requirement_id
  - features

# ---------- 顶层字段格式 ----------
format:
  # major.minor 形式；不接受 '1' / '1.0.0' / '1.0-beta'
  # 禁止用 enum 锁定具体值——靠 format regex + check_features.py SUPPORTED_VERSIONS 双层校验
  schema_version: '^\d+\.\d+$'
  requirement_id: '^REQ-\d{4}-\d{3}$'

# ---------- features[] 每条 feature 必填字段 ----------
feature_required_fields:
  - id
  - title
  - description
  - modules
  - depends_on
  - depends_on_features
  - complexity
  - touches
  - acceptance

# ---------- features[] 每条 feature 字段格式 ----------
feature_format:
  id: '^F-\d{3}$'
  # depends_on_features 元素格式（在 check_features.py 中逐元素校验）
  depends_on_features_item: '^F-\d{3}$'

# ---------- features[] 枚举 ----------
enums:
  complexity:
    - trivial
    - light
    - medium
    - heavy

# ---------- features[] 可选字段（文档化用途；不在 feature_required_fields 内） ----------
optional_feature_fields:
  - estimate_days     # number，不强制
  - interfaces_frozen # bool，不强制

# ---------- 字段定义（文档化用途） ----------
fields:
  schema_version:
    type: string
    format: schema_version
    required: true
    description: "schema 版本，格式 major.minor（如 '1.0'）"
  requirement_id:
    type: string
    format: requirement_id
    required: true
    description: "需求 ID，格式 REQ-YYYY-NNN"
  features:
    type: list
    items: object
    required: true
    description: "feature 列表；每条含下列字段"
  id:
    type: string
    format: "^F-\\d{3}$"
    required: true
    description: "feature 唯一标识，格式 F-NNN（如 F-001）"
  title:
    type: string
    required: true
    description: "feature 标题（一句话）"
  description:
    type: string
    required: true
    description: "feature 详细说明"
  modules:
    type: list
    items: string
    required: true
    description: "涉及的模块 / 组件列表"
  depends_on:
    type: list
    items: string
    required: true
    description: "外部依赖列表（通常空）"
  depends_on_features:
    type: list
    items: string
    required: true
    description: "依赖的其他 feature id 列表，元素格式 ^F-\\d{3}$"
  complexity:
    type: enum
    enum: complexity
    required: true
    description: "开发复杂度：trivial / light / medium / heavy"
  touches:
    type: list
    items: string
    required: true
    description: "变更触及的文件 / 路径列表"
  acceptance:
    type: list
    items: string
    required: true
    description: "验收标准列表（至少一条）"
  estimate_days:
    type: number
    required: false
    description: "预估工作日（可选）"
  interfaces_frozen:
    type: bool
    required: false
    description: "接口契约是否已冻结（可选）"
