# review JSON 团队级 Schema 定义
#
# 用途：
#   - save-review.sh 写入前的字段 / 枚举 / CR 规则唯一事实源
#   - check-reviews.sh 读取时的 schema 复检
#
# 修改原则：
#   - 字段增删或 CR 规则调整必须走 PR review（影响所有 reviewer Agent）
#   - schema_version 升 2.0 必须迁移历史 review 文件
#
# 关联文档：
#   - context/team/engineering-spec/specs/2026-04-27-reviewer-verdict-structuring-design.md
#   - docs/superpowers/specs/2026-05-19-remove-human-signoff-soft-confirmation-design.md
#
# 历史变更：
#   - 20260519-remove-human-signoff（F-001）：删除 human_signoff 字段与 signoff_decision /
#     signoff_source 枚举；删除 CR-1（已签字 + required_fixes == [] 约束）与 CR-8（signoff.source
#     枚举校验）；CR-4 仅保留 `score < 70 => conclusion != looks_clean`（不再带 signoff 约束）。
#     保留收紧的三条机器规则：
#       (a) required_fixes 非空 → conclusion ∈ {needs_attention, blocked}（CR-2）
#       (b) 总评 score < 70 → conclusion != looks_clean（CR-4）
#       (c) blocker issue 存在 → conclusion = blocked（CR-6）
#     人工动作改为软确认（不写 verdict），详 spec §目标行为。

schema_version: "1.0"

# ---------- 必填字段 ----------
required_fields:
  - schema_version
  - review_id
  - requirement_id
  - phase
  - reviewer
  - reviewed_at
  - reviewed_commit
  - reviewed_artifacts
  - conclusion
  - score
  - dimensions
  - required_fixes
  - suggestions
  - scope
  - supersedes

# ---------- 枚举 ----------
enums:
  phase:
    - definition
    - outline-design
    - detail-design
    - code           # 注：评审类别名，与生命周期 phase 不同；code 类按 feature_id 多次评审
  reviewer:
    - requirement-quality-reviewer
    - outline-design-quality-reviewer
    - detail-design-quality-reviewer
    - code-quality-reviewer
  conclusion:
    - looks_clean
    - needs_attention
    - blocked
  severity:
    - blocker
    - major
    - minor

# ---------- 字段定义（文档化用途；CR 规则以 _check_cr_rules 实现为准） ----------
fields:
  conclusion:
    type: enum
    enum: conclusion
    required: true          # 已在 required_fields 声明

# ---------- 字段格式 ----------
format:
  schema_version: '^1\.0$'
  # 20260519-remove-human-signoff codex-fix P1 / F-009 follow-up：扩接受新旧两种 key 格式
  #   - legacy review_id：REV-REQ-YYYY-NNN-<phase>(-F-NNN)?-NNN
  #   - 新格式 review_id：REV-YYYYMMDD-<slug>[-NN]-<phase>(-F-NNN)?-NNN
  # phase 段（definition / outline-design / detail-design / code(-F-NNN)?）保持原约束。
  review_id: '^REV-(REQ-\d{4}-\d{3}|\d{8}-[a-z0-9]+(?:-[a-z0-9]+)*(?:-\d{2})?)-(definition|outline-design|detail-design|code(-F-\d{3})?)-\d{3}$'
  requirement_id: '^(REQ-\d{4}-\d{3}|\d{8}-[a-z0-9]+(?:-[a-z0-9]+)*(?:-\d{2})?)$'
  reviewed_at: datetime          # YYYY-MM-DD HH:MM:SS（time-format.md）
  reviewed_commit: '^[0-9a-f]{7,40}$'

# ---------- 数值范围 ----------
ranges:
  score: [0, 100]
  dimensions_score: [0, 100]    # 各维度 score 也走同一范围

# ---------- CR 规则（C3，烧进 schema 的内部一致性约束） ----------
# 违反任一条 → save-review.sh 拒收，返回 ERROR
# 20260519-remove-human-signoff F-001：CR-1（已签字 + required_fixes==[] 约束）与 CR-8
# （human_signoff.source 枚举校验）已删除；CR-4 仅保留 score < 70 → conclusion 非
# looks_clean 单一约束。其余规则保持不变。
cr_rules:
  CR-2:
    description: "required_fixes 非空时 conclusion 必须 ∈ {needs_attention, blocked}"
    rule: "len(required_fixes) > 0 => conclusion in [needs_attention, blocked]"
  CR-3:
    description: "任一 dimensions.*.score < 60 时 conclusion 不能为 looks_clean"
    rule: "any dim.score < 60 => conclusion != looks_clean"
  CR-4:
    description: "总评 score < 70 时 conclusion 不能为 looks_clean"
    rule: "score < 70 => conclusion != looks_clean"
  CR-5:
    description: "dimensions.*.issues[] 每项必须有合法 severity 和非空 description"
    rule: "for issue in dim.issues: issue.severity in enums.severity AND issue.description != ''"
  CR-6:
    description: "任一 issue.severity = blocker 时 conclusion 必须为 blocked"
    rule: "any issue.severity == blocker => conclusion == blocked"
  CR-7:
    description: "conclusion 必须命中新枚举 {looks_clean, needs_attention, blocked}；阻断 AI 残留写旧值 approved"
    rule: "conclusion in {looks_clean, needs_attention, blocked}"

# ---------- scope 约束 ----------
# phase=code 必须有 scope.feature_id；其他 phase 必须 scope=null
scope_rules:
  - when: { phase: code }
    must:
      scope: object
      scope.feature_id: '^F-\d{3}$'
  - when: { phase_not: [code] }
    must:
      scope: null
