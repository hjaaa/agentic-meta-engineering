# meta.yaml 团队级 Schema 定义
#
# 用途：
#   - check-meta.sh 校验 requirements/<id>/meta.yaml 时的唯一事实源
#   - /workflow:next [F-012 待落地] 门禁 / CI workflow 依赖此文件决定必填与枚举（F-012 后）
#
# 修改原则：
#   - required_fields / enums / format 的变更必须走 PR review（影响历史需求）
#   - 新增可选字段可以宽松合入
#
# 关联文档：
#   - context/team/engineering-spec/specs/2026-04-22-index-meta-validation-design.md
#   - .claude/skills/managing-requirement-lifecycle/templates/meta.yaml.tmpl
#   - context/team/engineering-spec/meta-schema.yaml `enums.phase`（canonical phase 单一事实源；F-012 后 phase-rules.md 已删）

# ---------- 必填字段（按组分类） ----------
# 所有 phase 下都要求字段在 YAML 中存在（即使值为空），便于机器校验。
# "非空必填" 由下方 conditional_required 按 phase 驱动。
required_fields:
  process:    # 流程组：所有阶段都必须存在且非空
    - id
    - title
    - phase
    - created_at
    - branch
    - base_branch
    - project
    - services
  semantic:   # 语义组：字段必须存在，但 bootstrap 阶段允许值为空
    - feature_area
    - change_type
    - affected_modules

# ---------- 枚举白名单 ----------
enums:
  # phase 枚举单一事实源（F-012 后此处即为事实源；phase-rules.md 已删）
  phase:
    - bootstrap
    - definition
    - tech-research
    - outline-design
    - detail-design
    - task-planning
    - development
    - testing
    - completed

  change_type:
    - feature     # 新功能
    - bugfix      # 线上/测试环境修 bug
    - refactor    # 结构调整但行为不变
    - perf        # 性能优化
    - security    # 安全相关（漏洞修复 / 加固）

  outcome:
    - shipped        # 已上线并稳定运行
    - abandoned      # 评估后放弃
    - rolled-back    # 上过线但被回滚

  log_layout:        # 可选；缺省视为 legacy（兼容老需求）
    - split          # v2：工具日志→process.tool.log / 语义事件→process.txt
    - legacy         # v1：工具 + 语义都写 process.txt

# ---------- 字段格式 ----------
# datetime 关键字：写入值必须符合 context/team/engineering-spec/time-format.md
#   - 新格式（强制）：`YYYY-MM-DD HH:MM:SS`（Asia/Shanghai）
#   - 旧格式（向后兼容）：`YYYY-MM-DDTHH:MM:SSZ`（UTC ISO 8601）
format:
  # 20260519-remove-human-signoff F-009 / D-001：扩为同时接受两种 key 格式
  #   - legacy REQ-YYYY-NNN（REQ-2026-014 D-014 历史兼容）
  #   - 新格式 YYYYMMDD-<slug>[-NN]（REQ-2026-014 D-013 起的默认）
  id: '^(REQ-\d{4}-\d{3}|\d{8}-[a-z0-9]+(?:-[a-z0-9]+)*(?:-\d{2})?)$'
  created_at: datetime
  completed_at: datetime
  archived_at: datetime

# ---------- 条件必填（非空校验） ----------
# 语法：
#   when.phase_not：当 meta.phase 不在列表中时触发
#   when.phase：当 meta.phase 等于指定值时触发
#   non_empty：列出的字段必须非空（string 非 ""，list 非 []）
conditional_required:
  # bootstrap 阶段允许语义字段为空；任何后续阶段必须补齐
  - when:
      phase_not: [bootstrap]
    non_empty:
      - feature_area
      - change_type
      - affected_modules

  # completed 阶段必须记录结果信息
  - when:
      phase: completed
    non_empty:
      - outcome
      - completed_at

# ---------- 项目级依赖 ----------
# feature_area 的合法值由各项目的 areas.yaml 决定
# check-meta.sh 读取 context/project/<meta.project>/areas.yaml
project_scoped_enums:
  feature_area:
    source: "context/project/{project}/areas.yaml"
    key: areas

# ---------- reviews 字段（v2 新增，PR1 阶段全为可选） ----------
# 由 save-review.sh / check-reviews.sh 维护，禁止主对话 LLM 直接 Edit。
# PR1 阶段不入 required_fields，也不入 conditional_required；
# PR4 升 strict 时再加条件必填规则（phase 在 definition 之后）。
#
# 结构示例（不在此处声明 schema，由 review-schema.yaml 间接约束）：
#   reviews:
#     definition:
#       latest: REV-REQ-2026-001-definition-002
#       conclusion: approved
#       reviewed_commit: 2fde52f
#       artifact_hashes:
#         "artifacts/requirement.md": "abc..."
#       history: [REV-..., REV-...]
#       stale: false
#     outline-design: { latest: null }
#     detail-design: { latest: null }
#     code:
#       by_feature:
#         F-001:
#           latest: REV-REQ-2026-001-code-F-001-001
#           conclusion: approved
#           reviewed_commit: ...
#           artifact_hashes: {...}
#           history: [...]
#           stale: false
optional_fields:
  - reviews
  - archived_at   # 归档时间戳；仅 phase=completed 时允许写入；格式见 context/team/engineering-spec/time-format.md
  - legacy   # PR4 新增；boolean，true 表示豁免 reviewer-verdict 校验（仅 check_reviews 跳过）

# ---------- fields 段（文档化 + 供 worktree-meta checker 消费） ----------
# check_meta.py 当前只消费 required_fields / enums / format / conditional_required 四类规则；
# fields: 段为文档化 schema，同时被 tests/lib/test_meta_schema_worktree.py 直接读取校验。
# 修改规则：新增可选字段宽松合入；enum 变更需 PR review（影响历史需求）。
fields:
  worktree:
    type: object
    required: false
    description: "worktree 隔离能力。旧需求缺该段视同 enabled=false（D-014）。"
    properties:
      enabled:
        type: bool
        required: false
      owner:
        type: enum
        enum: [workflow, external, none]
        required: false
      path:
        type: string
        required: false
      absolute_path:
        type: string
        required: false      # P1-4：status / list 展示用，与 §2.1 字段表 12 字段全集对齐
      branch:
        type: string
        required: false
      base_branch:
        type: string
        required: false
      created_at:
        type: string
        required: false
      baseline:
        type: object
        required: false
        properties:
          command:
            type: string
            required: false
          status:
            type: enum
            enum: [passed, failed, skipped]
            required: false
          completed_at:
            type: string
            required: false
      cleanup:
        type: object
        required: false
        properties:
          policy:
            type: enum
            enum: [owned-only, never]
            required: false      # OD-3：本期 archive_runner 不消费
          removed_at:
            type: string
            required: false      # archive 回填；canonical unset = 空串 ""（见 §2.1 schema 语义边界）

# ---------- legacy 字段（v2 新增，PR4 引入） ----------
# 用途：标记历史需求豁免 reviewer-verdict 体系的 review 校验
#   - 仅影响 scripts/lib/check_reviews.py 的入口短路
#   - 不影响 check_meta / check_index / check_sourcing
#   - 不豁免本次新增的 4 个派发链 gate（GATE-POST-DEV-RECEIPT / GATE-TOUCHES-VIOLATION /
#     GATE-FEATURES-SCHEMA / GATE-TASK-FRONTMATTER）：D-005 #2 决议——historic
#     completed REQ 由 trigger / changed_files 路径自然隔离，不依赖 legacy 短路。
#     来源：D-006 V-07 修订；详见 REQ-2026-008 detailed-design.md §5.2
#   - 适用场景：completed 阶段的历史 REQ（PR3 之前产出，meta.yaml 无 reviews 字段）
# 语义：
#   - true：跳过所有 R001~R007 校验
#   - false / 缺省：正常校验
# 引入新字段后切忌泛滥使用；新增 REQ 必须走结构化 reviewer 通道。
