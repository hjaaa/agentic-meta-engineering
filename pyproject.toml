[tool.pytest.ini_options]
# H-22 fix: 支持 should_xxx_when_yyy 命名规范（与 CLAUDE.md 测试规范对齐）
python_functions = ["test_*", "should_*"]

[tool.ruff]
# F-005：ruff 集成。select=["F"] 起步（历史 E501 共 289 条，>200 阈值触发降级策略）
# E501(line-too-long) 289 条 / E402 13 条 / F401 2 条 / F841 2 条 = 306 总计
# 策略：>200 → 降级 select=["F"]；E/W 类待后续独立 PR 修复
select = ["F"]
line-length = 120
