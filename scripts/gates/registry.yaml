# 统一门禁 registry —— 唯一事实源（来源：requirements/REQ-2026-002/artifacts/detailed-design.md §1）
#
# 字段顺序约定（F-002/F-003 追加 gate 时严格遵守）：
#   id → plugin → severity → triggers → applies_when → dependencies →
#   side_effects → failure_message → escape_hatch（可选）→ tests
#
# 9 字段命名锁定：id / plugin / severity / triggers / applies_when / dependencies /
#                   side_effects / failure_message / tests
# escape_hatch 为 gate 级可选段，不计入"必填 9 字段"。
#
# Schema 校验规则 S1~S10：见 detailed-design.md §1 表格。

schema_version: "1.0"

gates:
  - id: GATE-META-SCHEMA
    plugin: meta_schema
    severity: error
    triggers:
      - pre-commit
      - phase-transition
      - submit
      - ci
      - post-dev
    applies_when:
      changed_files:
        - "requirements/*/meta.yaml"
      target_phase: null
      current_phase_in: []
      transition: null
      requires: []
    dependencies: []
    side_effects: none
    failure_message: |
      {gate_id} 失败：{message}
      修复建议：{fix_hint}
    tests:
      fixtures: [pass, fail, skip]

  - id: GATE-INDEX-INTEGRITY
    plugin: index_integrity
    severity: error
    triggers:
      - pre-commit
      - phase-transition
      - submit
      - ci
      - post-dev
    applies_when:
      changed_files:
        - "context/**/*.md"
        - "requirements/**/*.md"
        - "**/INDEX.md"
      target_phase: null
      current_phase_in: []
      transition: null
      requires: []
    dependencies: []
    side_effects: none
    failure_message: |
      {gate_id} 失败：{message}
      修复建议：{fix_hint}
    tests:
      fixtures: [pass, fail, skip]

  - id: GATE-SOURCING
    plugin: sourcing
    severity: error
    triggers:
      - pre-commit
      - phase-transition
      - submit
      - ci
      - post-dev
    applies_when:
      changed_files:
        - "requirements/*/artifacts/**/*.md"
      target_phase: null
      current_phase_in: []
      transition: null
      requires: []
    dependencies: []
    side_effects: none
    failure_message: |
      {gate_id} 失败：{message}
      修复建议：{fix_hint}
    tests:
      fixtures: [pass, fail, skip]

  - id: GATE-PLAN-FRESHNESS
    plugin: plan_freshness
    severity: warning
    triggers:
      - pre-commit
      - phase-transition
      - submit
      - ci
      - post-dev
    applies_when:
      changed_files:
        - "requirements/*/plan.md"
      target_phase: null
      current_phase_in: []
      transition: null
      requires: []
    dependencies: []
    side_effects: none
    failure_message: |
      {gate_id} 失败：{message}
      修复建议：{fix_hint}
    tests:
      fixtures: [pass, fail, skip]

  - id: GATE-WORKSPACE-CLEAN
    plugin: workspace_clean
    severity: error
    triggers:
      - pre-commit
      - phase-transition
      - submit
      - post-dev
    applies_when:
      changed_files: []
      target_phase: null
      current_phase_in: []
      transition: null
      requires: []
    dependencies: []
    side_effects: none
    failure_message: |
      {gate_id} 失败：{message}
      修复建议：{fix_hint}
    tests:
      fixtures: [pass, fail, skip]

  - id: GATE-REVIEW-VERDICT
    plugin: review_verdict
    severity: error
    triggers:
      - phase-transition
      - submit
      - ci
    applies_when:
      changed_files: []
      target_phase: null
      current_phase_in: []
      transition: null
      requires: []
    dependencies: []
    # F-003 H1：R005 改为事务化（staged_writes），全 gate pass 后由 runner 统一 commit
    side_effects: write_state
    failure_message: |
      {gate_id} 失败：{message}
      修复建议：{fix_hint}
    escape_hatch:
      cli_flag: --skip-review-verdict
      env_var: null
      requires_reason: true
      audit: true
    # F-004：标记 review-verdict 类 gate；force-with-blockers / bypass-review-blockers
    # escape hatch 命中后只放行该 tag 的 gate，避免对 workspace_clean / meta_schema 等
    # 非 review 类失败一律放行（F6 缺陷修复）。
    tags: [review-verdict]
    tests:
      fixtures: [pass, fail, skip]

  - id: GATE-POST-DEV-RECEIPT
    plugin: post_dev_receipt
    severity: error
    triggers:
      - phase-transition
      - submit
    applies_when:
      changed_files: []           # 无 path 限定（tasks/<fid>.md status=done 才是触发条件，但走 plugin precheck）
      target_phase: null          # submit 无 target_phase；phase-transition 的 development→testing 检查在 plugin precheck
      current_phase_in: []        # 运行时 phase 检查在 plugin precheck（S9 不允许 requires 放 path 谓词）
      transition: null            # transition 精确过滤下沉到 plugin precheck（与 GATE-TRACEABILITY 一致）
      requires: []                # 不依赖 meta.* 谓词
    dependencies: []
    side_effects: none
    failure_message: |
      {gate_id} 失败：{message}
      修复建议：{fix_hint}
    tests:
      fixtures: [pass, fail, skip]

  - id: GATE-TRACEABILITY
    plugin: traceability
    severity: error
    triggers:
      - phase-transition
      - submit
    applies_when:
      changed_files: []
      target_phase: null
      current_phase_in: []
      transition: null
      requires: []
    dependencies: []
    side_effects: none
    failure_message: |
      {gate_id} 失败：{message}
      修复建议：{fix_hint}
    escape_hatch:
      cli_flag: --skip-traceability
      env_var: null
      requires_reason: true
      audit: true
    # F-003：legacy=true 的历史 REQ 没有完整追溯链，runner 层 grandfather 跳过。
    # 仅本 gate 加该 tag；其他 gate 保守不加（detailed-design.md §3.5）。
    tags: [legacy-bypass]
    tests:
      fixtures: [pass, fail, skip]

  - id: GATE-REVIEWS-CONSISTENCY
    plugin: reviews_consistency
    severity: error
    triggers:
      - pre-commit
      - ci
    applies_when:
      changed_files:
        - "requirements/*/meta.yaml"
        - "requirements/*/reviews/*.json"
      target_phase: null
      current_phase_in: []
      transition: null
      requires: []
    dependencies: []
    side_effects: none
    failure_message: |
      {gate_id} 失败：{message}
      修复建议：{fix_hint}
    tests:
      fixtures: [pass, fail, skip]

  - id: GATE-PR-MERGED-STATE
    plugin: pr_state
    severity: error
    triggers:
      - submit
    applies_when:
      changed_files: []
      target_phase: null
      current_phase_in: []
      transition: null
      requires:
        - meta.pr_number
    dependencies: []
    side_effects: none
    failure_message: |
      {gate_id} 失败：{message}
      修复建议：{fix_hint}
    tests:
      fixtures: [pass, fail, skip]

  - id: GATE-GH-AUTH
    plugin: gh_auth
    severity: error
    triggers:
      - submit
    applies_when:
      changed_files: []
      target_phase: null
      current_phase_in: []
      transition: null
      requires: []
    dependencies: []
    side_effects: none
    failure_message: |
      {gate_id} 失败：{message}
      修复建议：{fix_hint}
    tests:
      fixtures: [pass, fail, skip]

  - id: GATE-BASE-REACHABLE
    plugin: base_reachable
    severity: error
    triggers:
      - submit
    applies_when:
      changed_files: []
      target_phase: null
      current_phase_in: []
      transition: null
      requires: []
    dependencies: []
    side_effects: none
    failure_message: |
      {gate_id} 失败：{message}
      修复建议：{fix_hint}
    tests:
      fixtures: [pass, fail, skip]

  # F-004：submit 链路三件套——分支匹配 / phase 可提交 / 本地领先 origin
  - id: GATE-BRANCH-MATCH
    plugin: branch_match
    severity: error
    triggers:
      - submit
    applies_when:
      changed_files: []
      target_phase: null
      current_phase_in: []
      transition: null
      requires: []
    dependencies: []
    side_effects: none
    failure_message: |
      {gate_id} 失败：{message}
      修复建议：{fix_hint}
    tests:
      fixtures: [pass, fail, skip]

  - id: GATE-BYPASS-PHASE-IN-SET
    plugin: phase_in_set
    severity: error
    triggers:
      - submit
    applies_when:
      changed_files: []
      target_phase: null
      current_phase_in: []
      transition: null
      requires: []
    dependencies: []
    side_effects: none
    failure_message: |
      {gate_id} 失败：{message}
      修复建议：{fix_hint}
    tests:
      fixtures: [pass, fail, skip]

  - id: GATE-AHEAD-OF-ORIGIN
    plugin: ahead_of_origin
    severity: error
    triggers:
      - submit
    applies_when:
      changed_files: []
      target_phase: null
      current_phase_in: []
      transition: null
      requires: []
    dependencies: []
    side_effects: none
    failure_message: |
      {gate_id} 失败：{message}
      修复建议：{fix_hint}
    tests:
      fixtures: [pass, fail, skip]

# 全局 escape 策略（流程级，非 gate 级）—— F-002 补全
escape_hatches:
  - id: legacy-requirement
    field: meta.legacy
    skips_gates_with_tag: [review-verdict]
    requires_reason: true
    audit: true

  - id: force-with-blockers
    cli_flag: --force-with-blockers
    triggers: [submit, phase-transition]   # round-2 新增 phase-transition（与 run.py:_handle_escape_hatch 对齐）
    # F-004：与 legacy-requirement 同款 tag 限定——命中后**仅**放行 review-verdict 类 gate；
    # 对 workspace_clean / meta_schema / branch_match 等非 review 类失败一律不放行。
    # 修复 F6（来源：notes.md:13）"任意 error fail 一律返 0"的越权逻辑。
    skips_gates_with_tag: [review-verdict]
    requires_reason: true
    audit: true

  # F-002：GATE-BASH-WRITE-PROTECT 已删除；保留此项供历史参考（不使用）
  - id: bypass-bash-write
    env_var: CLAUDE_GATES_BYPASS
    requires_reason_var: CLAUDE_GATES_BYPASS_REASON
    skips_gates: []
    requires_reason: true
    audit: true
